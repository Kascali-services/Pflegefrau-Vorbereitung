<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pflegefachfrau Vorbereitung</title>
    <script>
      // This script redirects from 404 to index.html for SPA routing on GitHub Pages
      // It preserves the path and query string for client-side routing
      // pathSegmentsToKeep = 1 keeps the repository name segment (/Pflegefrau-Vorbereitung)
      var pathSegmentsToKeep = 1;
      var l = window.location;
      
      // Extract path segments after the repository name
      var allSegments = l.pathname.slice(1).split('/');
      var appPath = allSegments.slice(pathSegmentsToKeep).join('/');
      
      // Encode ampersands as ~and~ to preserve query parameters during redirect
      var encodedPath = appPath.replace(/&/g, '~and~');
      var encodedSearch = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
      
      // Build the base URL with repository path
      var baseUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '');
      var repoPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      
      // Redirect to index.html with encoded path in query string
      l.replace(baseUrl + repoPath + '/?/' + encodedPath + encodedSearch + l.hash);
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
