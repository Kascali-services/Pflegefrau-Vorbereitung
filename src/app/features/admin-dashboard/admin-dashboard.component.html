<div class="admin-dashboard-container">
  <mat-card class="dashboard-card">
    <mat-card-header>
      <mat-card-title>Dashboard - Benutzerverwaltung</mat-card-title>
      <mat-card-subtitle>Übersicht aller registrierten Benutzer</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <!-- Loading state -->
      <div *ngIf="isLoading" class="loading-container">
        <mat-spinner></mat-spinner>
        <p>Lade Benutzer...</p>
      </div>

      <!-- Error message -->
      <div *ngIf="errorMessage && !isLoading" class="error-message">
        {{ errorMessage }}
      </div>

      <!-- Users table -->
      <div *ngIf="!isLoading && !errorMessage" class="table-container">
        <table mat-table [dataSource]="users" class="users-table">
          <!-- Email Column -->
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>E-Mail</th>
            <td mat-cell *matCellDef="let user">{{ user.email }}</td>
          </ng-container>

          <!-- First Name Column -->
          <ng-container matColumnDef="firstName">
            <th mat-header-cell *matHeaderCellDef>Vorname</th>
            <td mat-cell *matCellDef="let user">{{ user.firstName }}</td>
          </ng-container>

          <!-- Last Name Column -->
          <ng-container matColumnDef="lastName">
            <th mat-header-cell *matHeaderCellDef>Nachname</th>
            <td mat-cell *matCellDef="let user">{{ user.lastName }}</td>
          </ng-container>

          <!-- Role Column -->
          <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef>Rolle</th>
            <td mat-cell *matCellDef="let user">
              <mat-chip [color]="getRoleColor(user.role)">
                {{ getRoleLabel(user.role) }}
              </mat-chip>
            </td>
          </ng-container>

          <!-- Created At Column -->
          <ng-container matColumnDef="createdAt">
            <th mat-header-cell *matHeaderCellDef>Registriert am</th>
            <td mat-cell *matCellDef="let user">{{ formatDate(user.createdAt) }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>

        <div *ngIf="users.length === 0" class="no-users">
          <p>Keine Benutzer gefunden</p>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
