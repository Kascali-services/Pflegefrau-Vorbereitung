<div class="lesson-creator-container">
  <div class="header">
    <button mat-icon-button (click)="cancel()" class="back-btn">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1 class="title">Neue Lektion erstellen</h1>
  </div>

  <mat-card class="creator-card">
    <mat-card-header *ngIf="courseName">
      <mat-card-title>Für den Kurs: {{ courseName }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form #lessonForm="ngForm">
        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Lektionstitel *</mat-label>
            <input
              matInput
              [(ngModel)]="lessonData.title"
              name="title"
              required
              placeholder="z.B.: Grundlagen der Anatomie"
            />
          </mat-form-field>
        </div>

        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Beschreibung</mat-label>
            <textarea
              matInput
              [(ngModel)]="lessonData.description"
              name="description"
              rows="3"
              placeholder="Beschreibung der Lektion..."
            ></textarea>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Dauer (Minuten)</mat-label>
            <input
              matInput
              type="number"
              [(ngModel)]="lessonData.durationMinutes"
              name="duration"
              min="0"
            />
          </mat-form-field>
        </div>

        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Position im Kurs</mat-label>
            <input
              matInput
              type="number"
              [(ngModel)]="lessonData.orderIndex"
              name="orderIndex"
              min="1"
            />
            <mat-hint>Die Reihenfolge dieser Lektion im Kurs</mat-hint>
          </mat-form-field>
        </div>

        <div class="form-actions">
          <button
            mat-raised-button
            color="primary"
            (click)="createLesson()"
            [disabled]="isSaving || !lessonForm.valid"
            type="button"
          >
            <mat-icon>save</mat-icon>
            Lektion erstellen
          </button>
          <button mat-button (click)="cancel()" [disabled]="isSaving" type="button">
            Abbrechen
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
