<div class="course-creator-container">
  <div class="header">
    <button mat-icon-button (click)="cancel()" class="back-btn">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1 class="title">Neuen Kurs erstellen</h1>
  </div>

  <mat-card class="creator-card">
    <mat-card-content>
      <form #courseForm="ngForm">
        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Kurstitel *</mat-label>
            <input
              matInput
              [(ngModel)]="courseData.title"
              name="title"
              required
              placeholder="z.B.: Anatomisches Vokabular"
            />
          </mat-form-field>
        </div>

        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Beschreibung *</mat-label>
            <textarea
              matInput
              [(ngModel)]="courseData.description"
              name="description"
              required
              rows="4"
              placeholder="Beschreiben Sie den Kursinhalt..."
            ></textarea>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Niveau</mat-label>
            <mat-select [(ngModel)]="courseData.level" name="level">
              <mat-option value="beginner">Anfänger</mat-option>
              <mat-option value="intermediate">Fortgeschritten</mat-option>
              <mat-option value="advanced">Experte</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Dauer (Minuten)</mat-label>
            <input
              matInput
              type="number"
              [(ngModel)]="courseData.durationMinutes"
              name="duration"
              min="0"
            />
          </mat-form-field>
        </div>

        <div class="form-group">
          <h3 class="thumbnail-label">Kursbild</h3>
          <div class="thumbnail-upload">
            <input
              type="file"
              #thumbnailInput
              (change)="onThumbnailSelected($event)"
              accept="image/*"
              style="display: none"
            />
            
            <div *ngIf="!thumbnailPreview && !courseData.thumbnailUrl" class="upload-placeholder">
              <button
                mat-raised-button
                type="button"
                (click)="thumbnailInput.click()"
                [disabled]="isSaving"
              >
                <mat-icon>upload</mat-icon>
                Bild hochladen
              </button>
              <p class="upload-hint">Akzeptierte Formate: JPG, PNG, GIF</p>
            </div>

            <div *ngIf="thumbnailPreview || courseData.thumbnailUrl" class="thumbnail-preview">
              <img [src]="thumbnailPreview || courseData.thumbnailUrl" alt="Kursbild" />
              <div class="preview-actions">
                <button
                  mat-raised-button
                  type="button"
                  (click)="thumbnailInput.click()"
                  [disabled]="isSaving"
                >
                  <mat-icon>edit</mat-icon>
                  Ändern
                </button>
                <button
                  mat-raised-button
                  color="warn"
                  type="button"
                  (click)="removeThumbnail()"
                  [disabled]="isSaving"
                >
                  <mat-icon>delete</mat-icon>
                  Entfernen
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button
            mat-raised-button
            color="primary"
            (click)="createCourse()"
            [disabled]="isSaving || !courseForm.valid"
            type="button"
          >
            <mat-icon>save</mat-icon>
            Kurs erstellen
          </button>
          <button mat-button (click)="cancel()" [disabled]="isSaving" type="button">
            Abbrechen
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
