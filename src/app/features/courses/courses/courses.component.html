<div class="courses-container">
  <h1>Verfügbare Kurse</h1>
  <p class="intro-text">
    Entdecken Sie unsere Kurse zur Vorbereitung auf die Pflegefachfrau Ausbildung
  </p>

  <div class="courses-grid">
    <div class="course-card" *ngFor="let module of modules">
      <div class="course-header">
        <h3>{{ module.title }}</h3>
        <span class="course-level">{{ getLevelLabel(module.level) }}</span>
      </div>
      <p class="course-description">{{ module.description }}</p>
      <div class="course-footer">
        <span class="course-duration">⏱️ {{ getEstimatedDuration(module) }}</span>
        <a [routerLink]="['/courses', module.id]" class="view-course-btn">Details ansehen</a>
      </div>
    </div>
  </div>
</div>
