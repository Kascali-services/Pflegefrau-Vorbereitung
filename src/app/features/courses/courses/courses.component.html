<div class="courses-container">
  <h1>Verfügbare Kurse</h1>
  <p class="intro-text">
    Entdecken Sie unsere Kurse zur Vorbereitung auf die Pflegefachfrau Ausbildung
  </p>

  <div class="courses-grid">
    <div class="course-card" *ngFor="let course of courses">
      <div class="course-thumbnail" *ngIf="course.thumbnailUrl">
        <img [src]="course.thumbnailUrl" [alt]="course.title" />
      </div>
      <div class="course-content">
        <div class="course-header">
          <h3>{{ course.title }}</h3>
          <span class="course-level">{{ getLevelLabel(course.level) }}</span>
        </div>
        <p class="course-description">{{ course.description }}</p>
        <div class="course-meta">
          <span class="course-lessons">📚 {{ course.lessonsCount }} Lektionen</span>
          <span class="course-duration">⏱️ {{ getEstimatedDuration(course) }}</span>
        </div>
        <div class="course-footer">
          <a [routerLink]="['/courses', course.id]" class="view-course-btn">Details ansehen</a>
        </div>
      </div>
    </div>
  </div>
</div>
