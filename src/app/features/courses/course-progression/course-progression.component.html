<div class="course-progression-container" *ngIf="lesson && isAccessible">
  <!-- Navigation header -->
  <div class="progression-header">
    <button class="back-btn" (click)="goBack()">← Zurück zum Kurs</button>
    <div class="lesson-info">
      <span class="course-title" *ngIf="course">{{ course.title }}</span>
      <span class="lesson-position" *ngIf="totalLessons">
        › Lektion {{ lessonIndex }} / {{ totalLessons }}
      </span>
    </div>
  </div>

  <!-- Lesson content -->
  <div class="lesson-container">
    <div class="lesson-header">
      <h1>📄 {{ lesson.title }}</h1>
      <div class="lesson-meta">
        <span class="duration">⏱️ {{ lesson.durationMinutes }} Min.</span>
        <span class="status" *ngIf="isCompleted">✅ Abgeschlossen</span>
      </div>
      <p class="lesson-description" *ngIf="lesson.description">{{ lesson.description }}</p>
    </div>

    <!-- Content (new multi-content structure or fallback to old format) -->
    <div class="lesson-content">
      <!-- New structure: display multiple content items -->
      <div *ngIf="lessonContents.length > 0">
        <div *ngFor="let content of lessonContents" class="content-item">
          <!-- Text content -->
          <div *ngIf="content.contentType === 'text'" [innerHTML]="formatContent(content.contentValue)"></div>
          
          <!-- Video content -->
          <div *ngIf="content.contentType === 'video'" class="video-container">
            <video controls [src]="content.contentValue">
              Your browser does not support the video tag.
            </video>
          </div>
          
          <!-- Image content -->
          <div *ngIf="content.contentType === 'image'" class="image-container">
            <img [src]="content.contentValue" [alt]="'Lesson content image'" />
          </div>
        </div>
      </div>
      
      <!-- Fallback to old format if no new content items -->
      <div *ngIf="lessonContents.length === 0 && lessonContent" [innerHTML]="formatContent(lessonContent)"></div>
    </div>

    <!-- Lesson navigation (Previous/Next) -->
    <div class="lesson-navigation">
      <button
        class="nav-btn prev-btn"
        (click)="goToPreviousLesson()"
        *ngIf="previousLesson"
        [title]="'Vorherige Lektion: ' + previousLesson.title"
      >
        ← Vorherige Lektion
      </button>
      <button
        class="nav-btn next-btn"
        (click)="goToNextLesson()"
        *ngIf="nextLesson && isNextLessonAccessible"
        [title]="'Nächste Lektion: ' + nextLesson.title"
      >
        Nächste Lektion →
      </button>
    </div>

    <!-- Action buttons -->
    <div class="lesson-actions">
      <button class="secondary-btn" (click)="goBack()">Zurück zum Kurs</button>
      <button
        class="primary-btn"
        (click)="completeLesson()"
        [disabled]="(isCompleted && !hasQuiz) || (hasQuiz && quizPassed)"
      >
        <span *ngIf="!hasQuiz && !isCompleted">Lektion abschließen</span>
        <span *ngIf="!hasQuiz && isCompleted">Abgeschlossen ✓</span>
        <span *ngIf="hasQuiz && !quizPassed">Quiz starten →</span>
        <span *ngIf="hasQuiz && quizPassed">Quiz bestanden ✓</span>
      </button>
      <button
        class="back-to-course-btn primary-btn"
        (click)="goBack()"
        *ngIf="isCompleted && !nextLesson && (!hasQuiz || quizPassed)"
      >
        Zurück zur Kursübersicht
      </button>
    </div>
  </div>
</div>

<div class="access-denied" *ngIf="!isAccessible && lesson">
  <div class="message">
    <h2>🔒 Lektion gesperrt</h2>
    <p>Sie müssen zuerst die vorherigen Lektionen abschließen, um auf diese Lektion zuzugreifen.</p>
    <button class="primary-btn" (click)="goBack()">Zurück zum Kurs</button>
  </div>
</div>

<div class="loading" *ngIf="!lesson">
  <p>Laden...</p>
</div>
