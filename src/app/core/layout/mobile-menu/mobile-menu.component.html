<div class="mobile-menu-container">
  <button
    mat-icon-button
    (click)="toggleMenu()"
    class="menu-button"
    aria-label="Open navigation menu"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <mat-drawer-container class="drawer-container" autosize>
    <mat-drawer #drawer class="mobile-drawer" mode="over" position="start" [disableClose]="false">
      <div class="drawer-header">
        <h2 class="drawer-title">Menü</h2>
        <button
          mat-icon-button
          (click)="closeMenu()"
          class="close-button"
          aria-label="Close navigation menu"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <nav class="drawer-nav" aria-label="Mobile navigation">
        <ul class="nav-list">
          <ng-container *ngFor="let link of navLinks">
            <!-- Links without children -->
            <li
              *ngIf="
                !link.children &&
                (!link.requiresAuth || (isAuthenticated$ | async)) &&
                (!link.requiresRole || (isContentManagerOrAdmin$ | async)) &&
                (!link.requiresAdmin || (isAdmin$ | async))
              "
              class="nav-item"
            >
              <a
                mat-button
                [routerLink]="link.path"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: link.exact || false }"
                (click)="closeMenu()"
                class="nav-link"
                [attr.aria-label]="'Navigate to ' + link.label"
              >
                {{ link.label }}
              </a>
            </li>

            <!-- Links with children (expansion panel) -->
            <li
              *ngIf="
                link.children &&
                (!link.requiresAuth || (isAuthenticated$ | async)) &&
                (!link.requiresRole || (isContentManagerOrAdmin$ | async)) &&
                (!link.requiresAdmin || (isAdmin$ | async))
              "
              class="nav-item nav-item-expandable"
            >
              <mat-expansion-panel class="mobile-expansion-panel">
                <mat-expansion-panel-header>
                  <mat-panel-title>
                    {{ link.label }}
                  </mat-panel-title>
                </mat-expansion-panel-header>
                <ul class="sub-nav-list">
                  <ng-container *ngFor="let child of link.children">
                    <li
                      *ngIf="
                        (!child.requiresAuth || (isAuthenticated$ | async)) &&
                        (!child.requiresRole || (isContentManagerOrAdmin$ | async)) &&
                        (!child.requiresAdmin || (isAdmin$ | async))
                      "
                      class="sub-nav-item"
                    >
                      <a
                        mat-button
                        [routerLink]="child.path"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{ exact: child.exact || false }"
                        (click)="closeMenu()"
                        class="nav-link sub-nav-link"
                        [attr.aria-label]="'Navigate to ' + child.label"
                      >
                        {{ child.label }}
                      </a>
                    </li>
                  </ng-container>
                </ul>
              </mat-expansion-panel>
            </li>
          </ng-container>
        </ul>

        <div class="drawer-divider"></div>

        <div class="user-section-mobile">
          <!-- Show logout button when authenticated -->
          <button
            *ngIf="isAuthenticated$ | async"
            mat-button
            class="nav-link user-link"
            (click)="onLogout()"
          >
            <mat-icon>logout</mat-icon>
            <span>Abmelden</span>
          </button>

          <!-- Show login button when not authenticated -->
          <button
            *ngIf="(isAuthenticated$ | async) === false"
            mat-button
            class="nav-link user-link"
            (click)="onLogin()"
          >
            <mat-icon>login</mat-icon>
            <span>Anmelden</span>
          </button>
        </div>
      </nav>
    </mat-drawer>
  </mat-drawer-container>
</div>
