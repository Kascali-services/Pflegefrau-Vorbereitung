<div class="mobile-menu-container">
  <button
    mat-icon-button
    (click)="toggleMenu()"
    class="menu-button"
    aria-label="Open navigation menu"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <mat-drawer-container class="drawer-container" autosize>
    <mat-drawer #drawer class="mobile-drawer" mode="over" position="start" [disableClose]="false">
      <div class="drawer-header">
        <h2 class="drawer-title">Menu</h2>
        <button
          mat-icon-button
          (click)="closeMenu()"
          class="close-button"
          aria-label="Close navigation menu"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <nav class="drawer-nav" aria-label="Mobile navigation">
        <ul class="nav-list">
          <li
            *ngFor="let link of navLinks"
            class="nav-item"
            [hidden]="link.requiresAuth && (isAuthenticated$ | async) === false"
          >
            <a
              mat-button
              [routerLink]="link.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: link.exact }"
              (click)="closeMenu()"
              class="nav-link"
              [attr.aria-label]="'Navigate to ' + link.label"
            >
              {{ link.label }}
            </a>
          </li>
        </ul>

        <div class="drawer-divider"></div>

        <div class="user-section-mobile">
          <!-- Show logout button when authenticated -->
          <button
            *ngIf="isAuthenticated$ | async"
            mat-button
            class="nav-link user-link"
            (click)="onLogout()"
          >
            <mat-icon>logout</mat-icon>
            <span>Déconnexion</span>
          </button>

          <!-- Show login button when not authenticated -->
          <button
            *ngIf="(isAuthenticated$ | async) === false"
            mat-button
            class="nav-link user-link"
            (click)="onLogin()"
          >
            <mat-icon>login</mat-icon>
            <span>Connexion</span>
          </button>
        </div>
      </nav>
    </mat-drawer>
  </mat-drawer-container>
</div>
