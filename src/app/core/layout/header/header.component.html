<mat-toolbar [class.scrolled]="isScrolled" class="header-toolbar">
  <div class="header-container">
    <!-- Mobile burger menu button on the left -->
    <app-mobile-menu class="mobile-nav mobile-burger"></app-mobile-menu>

    <div class="logo-section">
      <a routerLink="/" class="logo-link" aria-label="Navigate to home page">
        <img
          src="/assets/logo/OB-horizontal-logo.png"
          alt="Pflegefachfrau Vorbereitung Logo"
          class="logo"
          height="40"
        />
        <span class="site-title">Pflegefrau Vorbereitung</span>
      </a>
    </div>

    <app-navigation class="desktop-nav"></app-navigation>

    <div class="user-section">
      <!-- Show person icon with menu when authenticated -->
      <button
        *ngIf="isAuthenticated$ | async"
        mat-icon-button
        [matMenuTriggerFor]="userMenu"
        class="user-button"
        aria-label="User menu"
      >
        <mat-icon>person</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="onLogout()">
          <mat-icon>logout</mat-icon>
          <span>Déconnexion</span>
        </button>
      </mat-menu>

      <!-- Show login button when not authenticated -->
      <button
        *ngIf="(isAuthenticated$ | async) === false"
        mat-button
        (click)="onLogin()"
        class="login-button"
        aria-label="Login"
      >
        <mat-icon>login</mat-icon>
        <span>Connexion</span>
      </button>
    </div>
  </div>
</mat-toolbar>
