<div mat-dialog-title>
  <h2>{{ data.title }}</h2>
</div>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">
    {{ data.cancelText }}
  </button>
  <button mat-raised-button color="warn" (click)="onConfirm()">
    {{ data.confirmText }}
  </button>
</mat-dialog-actions>
