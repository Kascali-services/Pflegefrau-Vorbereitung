<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pflegefachfrau Vorbereitung</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script type="text/javascript">
      // GitHub Pages SPA redirect handling
      // This script restores the original path after a 404 redirect from 404.html
      // Format from 404.html: /?/path&query=value (with ~and~ replacing &)
      (function(l) {
        if (l.search.length > 1 && l.search[1] === '/') {
          // Get everything after /?/
          var encodedUrl = l.search.slice(2);
          // Split path and query parts (separated by &)
          var parts = encodedUrl.split('&');
          // First part is the path
          var path = '/' + parts[0];
          // Remaining parts are query parameters (decode ~and~ back to &)
          var query = parts.length > 1 ? 
            '?' + parts.slice(1).join('&').replace(/~and~/g, '&') : '';
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + path + query + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
